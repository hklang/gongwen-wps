<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>公文工程</title>
  <link rel="stylesheet" href="./proj-aside.css" />
  <script type="text/javascript" src="../js/util.js"></script>
  <script type="text/javascript" src="../js/userPrefs.js"></script>
  <script type="text/javascript" src="../js/followHost.js"></script>
  <script type="text/javascript" src="../js/relay.js"></script>
  <script type="text/javascript" src="../js/projectRoot.js"></script>
  <script type="text/javascript" src="../js/projAside.js"></script>
  <script type="text/javascript">
    if (window.GwUserPrefs) GwUserPrefs.watchWindow("project");
  </script>
</head>
<body>
  <aside id="projAside" aria-label="本工程文件">
    <div class="proj-aside-main">
      <div class="proj-aside-head">
        <strong id="projAsideTitle">工程文件</strong>
        <span class="proj-aside-actions">
          <button type="button" id="btnProjBind" class="proj-icon-btn" title="改绑工程文件夹（默认跟当前文档目录）" aria-label="改绑">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          </button>
          <button type="button" id="btnProjRefresh" class="proj-icon-btn" title="刷新列表" aria-label="刷新">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
          </button>
          <button type="button" id="btnProjCollapse" class="proj-icon-btn" title="收起侧栏" aria-label="收起">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="M14 9l-3 3 3 3"/></svg>
          </button>
        </span>
      </div>
      <div class="proj-aside-body" id="projAsideBody" tabindex="0">
        <div class="file-empty">打开文稿后列出本工程 md</div>
      </div>
      <div class="proj-aside-foot" id="projStatus" hidden></div>
    </div>
    <button type="button" id="projAsideRail" class="proj-aside-rail" title="展开工程文件">工<br>程</button>
    <div id="projAsideResize" class="proj-aside-resize" title="拖拽调宽 · 双击复位" aria-hidden="true"></div>
  </aside>
</body>
</html>
