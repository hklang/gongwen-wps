<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>公文助手</title>
  <link rel="stylesheet" href="./proj-aside.css" />
  <link rel="stylesheet" href="./ai-aside.css" />
  <link rel="stylesheet" href="./workspace.css" />
  <script type="text/javascript" src="../js/util.js"></script>
  <script type="text/javascript" src="../js/userPrefs.js"></script>
  <script type="text/javascript" src="../js/followHost.js"></script>
  <script type="text/javascript" src="../js/docapi.js"></script>
  <script type="text/javascript" src="../js/relay.js"></script>
  <script type="text/javascript" src="../js/account.js"></script>
  <script type="text/javascript" src="../js/projectRoot.js"></script>
  <script type="text/javascript" src="../js/projAside.js"></script>
  <script type="text/javascript" src="../js/taskpane.js"></script>
  <script type="text/javascript">
    if (window.GwUserPrefs) GwUserPrefs.watchWindow("assistant");
  </script>
</head>
<body>
  <div id="gwWorkspace">
    <aside id="projAside" aria-label="本工程文件">
      <div class="proj-aside-main">
        <div class="proj-aside-head">
          <strong id="projAsideTitle">工程文件</strong>
          <span class="proj-aside-actions">
            <button type="button" id="btnProjBind" class="proj-icon-btn" title="改绑工程文件夹" aria-label="改绑">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            </button>
            <button type="button" id="btnProjRefresh" class="proj-icon-btn" title="刷新列表" aria-label="刷新">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
            </button>
            <button type="button" id="btnProjCollapse" class="proj-icon-btn" title="收起工程栏" aria-label="收起">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="M14 9l-3 3 3 3"/></svg>
            </button>
          </span>
        </div>
        <div class="proj-aside-body" id="projAsideBody" tabindex="0">
          <div class="file-empty">打开文稿后列出本工程 md</div>
        </div>
        <div class="proj-aside-foot" id="projStatus" hidden></div>
      </div>
      <button type="button" id="projAsideRail" class="proj-aside-rail" title="展开工程文件">工<br>程</button>
      <div id="projAsideResize" class="proj-aside-resize" title="拖拽调宽" aria-hidden="true"></div>
    </aside>
    <aside id="aiAside" aria-label="人机双写">
      <div class="ai-head">
        <div class="ai-tabs">
          <button type="button" class="on" id="aiTabWrite" data-tab="write">撰写</button>
          <button type="button" id="aiTabSuite" data-tab="suite">精修</button>
          <button type="button" id="aiTabProof" data-tab="proof">校对</button>
        </div>
        <div class="ai-head-actions" id="aiHeadActions">
          <select id="aiCapability" class="ai-session-sel" aria-label="智能能力">
            <option value="fast">标准</option>
            <option value="strong">增强</option>
          </select>
        </div>
      </div>
      <div class="ai-proof-bar" id="aiProofBar" hidden>
        <div class="ai-proof-row">
          <label class="ai-proof-scope"><input type="radio" name="proofScope" value="selection" /> 选区</label>
          <label class="ai-proof-scope"><input type="radio" name="proofScope" value="full" checked /> 全文</label>
        </div>
        <div class="ai-proof-actions">
          <button type="button" class="primary" id="proofRun">开始校对</button>
          <button type="button" id="proofClear" disabled>清空</button>
        </div>
      </div>
      <div class="ai-opts" id="aiOpts">
        <div class="ai-empty">划选正文后，在下方输入要求。</div>
      </div>
      <div class="ai-compose" id="aiCompose">
        <div class="ai-sel-block" id="aiSelBlock">
          <div class="ai-sel-pop" id="aiSelPop" hidden>
            <div class="ai-sel-pop-bar">
              <span id="aiSelPopMeta">0 字</span>
              <span class="ai-sel-pop-actions">
                <button type="button" id="aiSelPopCopy">复制</button>
                <button type="button" id="aiSelPopClose">收起</button>
              </span>
            </div>
            <div class="ai-sel-pop-body" id="aiSelPopBody"></div>
          </div>
          <div class="ai-sel-row" id="aiSelRow">
            <button type="button" class="ai-sel" id="aiSel" title="展开/收起">
              <span class="ai-sel-text" id="aiSelText">未钉住 · 划选后点钉住</span>
              <span class="ai-sel-x" id="aiSelClear" hidden title="清除">×</span>
            </button>
            <button type="button" class="ai-sel-btn primary-ish" id="aiSelCommit">钉住</button>
            <button type="button" class="ai-reselect" id="aiRestore" title="还原为出方案前的原文" hidden>还原</button>
          </div>
          <label class="ai-expand-sib" id="aiExpandSibWrap" hidden>
            <input type="checkbox" id="aiExpandSib" />
            <span>扩选同级标题</span>
          </label>
        </div>
        <div class="ai-cite-bar" id="aiCiteBar" hidden></div>
        <div class="ai-suite-presets" id="aiWriteTips" hidden>
          <button type="button" data-write-tip="请帮我明确本稿读者、主旨一句话与不写的边界。先讨论立意，少写正文。">立意</button>
          <button type="button" data-write-tip="请帮我搭一、二、三级标题骨架，先出可落稿的目录，少写段落。">搭架</button>
          <button type="button" data-write-tip="请按现有标题充填事实与数据；无依据处标待核实，禁止编造数字。">充填</button>
        </div>
        <div class="ai-suite-presets" id="aiSuitePresets" hidden>
          <button type="button" data-suite-preset="优化表述，更准确凝练">优化润色</button>
          <button type="button" data-suite-preset="句式更工整对仗">工整对仗</button>
          <button type="button" data-suite-preset="增强语言感染力">增强感染力</button>
          <button type="button" data-suite-preset="更口语、好念">更口语化</button>
          <button type="button" data-suite-preset="恰当加入名言警句（勿堆砌）">加名言警句</button>
          <button type="button" data-suite-preset="删繁就简，保留要点">更简洁</button>
        </div>
        <textarea class="ai-req" id="aiReq" rows="3" placeholder="问点什么…"></textarea>
        <div class="ai-toolbar">
          <div class="ai-edit-mode" id="aiChatAuthWrap">
            <label class="ai-chat-auth"><input type="radio" name="aiEditMode" value="talk" id="aiEditModeTalk" checked /><span>仅对话</span></label>
            <label class="ai-chat-auth"><input type="radio" name="aiEditMode" value="auth" id="aiEditModeAuth" /><span>授权改稿</span></label>
          </div>
          <span class="ai-suite-hint" id="aiSuiteHint" hidden>精修会改写选定</span>
          <button type="button" id="aiClearChat">清空</button>
          <span class="spacer"></span>
          <button type="button" class="primary" id="aiSend">发送</button>
        </div>
        <div class="ai-compose-foot" id="aiComposeFoot">
          <span class="ai-edit-status" id="aiEditStatus">WPS</span>
          <span class="ai-tip" id="aiTip"></span>
        </div>
      </div>
    </aside>
  </div>
</body>
</html>
